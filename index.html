<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>守护绿水青山 - 环境保护</title>
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        body {
            line-height: 1.6;
            color: #333;
            background-color: #f9f9f9;
        }

        /* 导航栏 */
        nav {
            background-color: #2d5a27;
            color: white;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .nav-links {
            list-style: none;
            display: flex;
        }

        .nav-links li {
            margin-left: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #a8e063;
        }

        /* 横幅区 */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), 
                        url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 600px;
        }

        /* 核心内容区 */
        .container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 40px;
            color: #2d5a27;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .card i {
            font-size: 3rem;
            color: #4caf50;
            margin-bottom: 15px;
            display: block;
        }

        .card h3 {
            margin-bottom: 15px;
            color: #333;
        }

        /* 呼吁行动 */
        .cta {
            background-color: #e8f5e9;
            padding: 60px 20px;
            text-align: center;
            margin-top: 50px;
        }

        .btn {
            display: inline-block;
            background-color: #2d5a27;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #3e7e39;
        }

        /* 页脚 */
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px 0;
            margin-top: 0;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2rem; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">🌿 绿色地球</div>
        <ul class="nav-links">
            <li><a href="#">首页</a></li>
            <li><a href="#">环境现状</a></li>
            <li><a href="#">行动指南</a></li>
            <li><a href="#">联系我们</a></li>
        </ul>
    </nav>

    <header class="hero">
        <h1>守护我们唯一的家园</h1>
        <p>地球不是我们从祖先那里继承的，而是我们向子孙后代借来的。</p>
    </header>

    <div class="container">
        <h2 class="section-title">我们可以做什么？</h2>
        <div class="features">
            <div class="card">
                <i>♻️</i>
                <h3>垃圾分类</h3>
                <p>合理分类生活垃圾，提高资源回收利用率，减少土地填埋压力。</p>
            </div>
            <div class="card">
                <i>🚲</i>
                <h3>低碳出行</h3>
                <p>优先选择公共交通、骑行或步行，减少私家车碳排放。</p>
            </div>
            <div class="card">
                <i>💧</i>
                <h3>节约资源</h3>
                <p>随手关灯、一水多用，拒绝使用一次性塑料制品。</p>
            </div>
        </div>
    </div>

    <section class="cta">
        <h2>每一份努力，都有意义</h2>
        <p>加入我们的环保行动，从现在开始改变。</p>
        <a href="mailto:info@example.com" class="btn">联系我们</a>
    </section>

    <footer>
        <p>&copy; 2024 保护环境倡议项目 | 纯净·绿色·未来</p>
    </footer>

</body>
</html>
